name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app tests scripts main.py
      - run: python -m pytest
      - run: pip-audit -r requirements.txt --disable-pip
      - run: python scripts/check_contract.py
      - run: python scripts/build.py
      - name: Install isolated production dependencies
        run: |
          python -m venv "$RUNNER_TEMP/production"
          "$RUNNER_TEMP/production/bin/python" -m pip install --require-hashes -r artifacts/requirements.txt
      - name: Verify production artifact imports
        run: cd artifacts && "$RUNNER_TEMP/production/bin/python" -c "import main; assert all(callable(getattr(main, name)) for name in ['api', 'worker', 'reconcile'])"
      - uses: actions/upload-artifact@v4
        with:
          name: function-source
          path: artifacts/
          retention-days: 7
  infrastructure:
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: function-source
          path: artifacts
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: mkdir -p build
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform test
