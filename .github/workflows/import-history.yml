name: Import and validate Hadoop service
on:
  push:
    branches: [main]
    paths:
      - '.github/import/**'
      - '.github/workflows/import-history.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: import-service-history
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import complete local history
        run: |
          base64 --decode .github/import/history.bundle.b64 > "$RUNNER_TEMP/history.bundle"
          echo "fa8d6679ee4630bb80dec581c79ccc6eb9637e97b15f07177a25aea936f5e0c5  $RUNNER_TEMP/history.bundle" | sha256sum --check
          git bundle verify "$RUNNER_TEMP/history.bundle"
          git fetch "$RUNNER_TEMP/history.bundle" main:refs/heads/imported-history
          test "$(git rev-parse imported-history)" = 7e7c94c9a8c93d2e0399f4c3010e4fb90bf620b6
          test "$(git rev-parse imported-history^{tree})" = 07beae63642766d816257790b19fb653187ca347
          git checkout imported-history
          git config user.name 'Roger Clevenger'
          git config user.email '70983614+rclevenger-hm@users.noreply.github.com'
          git merge --allow-unrelated-histories -s ours --no-commit origin/main
          git restore --source=origin/main -- .github/workflows/import-history.yml .github/import/history.bundle.b64
          git add .github/workflows/import-history.yml .github/import/history.bundle.b64
          git commit -m 'Import GCP Hadoop automation development history'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app tests scripts main.py && python -m pytest && python scripts/check_contract.py
      - run: pip-audit -r requirements.txt --disable-pip
      - run: python scripts/build.py
      - name: Verify isolated production imports
        run: |
          python -m venv "$RUNNER_TEMP/production"
          "$RUNNER_TEMP/production/bin/python" -m pip install --require-hashes -r artifacts/requirements.txt
          cd artifacts
          "$RUNNER_TEMP/production/bin/python" -c "import main; assert all(callable(getattr(main, name)) for name in ['api', 'worker', 'reconcile'])"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform test
      - name: Publish validated history without force
        run: git push origin HEAD:main
      - name: Run CI on the published branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml', ref: 'main'});
